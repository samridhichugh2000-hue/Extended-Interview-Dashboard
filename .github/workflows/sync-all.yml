          KOENIG_SKILLS_API_USERNAME: ${{ secrets.KOENIG_SKILLS_API_USERNAME }}
          KOENIG_SKILLS_API_PASSWORD: ${{ secrets.KOENIG_SKILLS_API_PASSWORD }}
          KOENIG_SKILLS_API_ROLE: ${{ secrets.KOENIG_SKILLS_API_ROLE }}
          KOENIG_SKILLS_API_KEY: ${{ secrets.KOENIG_SKILLS_API_KEY }}

          KOENIG_TECHCALL_API_USERNAME: ${{ secrets.KOENIG_TECHCALL_API_USERNAME }}
          KOENIG_TECHCALL_API_PASSWORD: ${{ secrets.KOENIG_TECHCALL_API_PASSWORD }}
          KOENIG_TECHCALL_API_ROLE: ${{ secrets.KOENIG_TECHCALL_API_ROLE }}
          KOENIG_TECHCALL_API_KEY: ${{ secrets.KOENIG_TECHCALL_API_KEY }}

          KOENIG_TECHCALLCONV_API_USERNAME: ${{ secrets.KOENIG_TECHCALLCONV_API_USERNAME }}
          KOENIG_TECHCALLCONV_API_PASSWORD: ${{ secrets.KOENIG_TECHCALLCONV_API_PASSWORD }}
          KOENIG_TECHCALLCONV_API_ROLE: ${{ secrets.KOENIG_TECHCALLCONV_API_ROLE }}
          KOENIG_TECHCALLCONV_API_KEY: ${{ secrets.KOENIG_TECHCALLCONV_API_KEY }}

          KOENIG_TBT_API_USERNAME: ${{ secrets.KOENIG_TBT_API_USERNAME }}
          KOENIG_TBT_API_PASSWORD: ${{ secrets.KOENIG_TBT_API_PASSWORD }}
